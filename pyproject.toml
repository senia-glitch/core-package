# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-package"
version = "0.2.0"
description = "Платформа для построения бизнес-сценариев с абстракциями и утилитами"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "senia-glitch", email = "senia-glitch@users.noreply.github.com"}
]
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyjwt>=2.0",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
event-infra = [
    "event-infra @ git+https://github.com/senia-glitch/event-infra.git",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
core-init = "core.cli:init"

[project.urls]
Repository = "https://github.com/senia-glitch/core-package"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
core = [
    "py.typed",
    "templates/*",
    "templates/structure_template/*",
    "templates/structure_template/**/*",
]